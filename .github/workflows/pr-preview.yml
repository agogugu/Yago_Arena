name: PR visual preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preview-link:
    runs-on: ubuntu-latest
    steps:
      - name: Add or update visual preview link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- yago-pr-preview -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const previewUrl = `https://rawcdn.githack.com/${owner}/${repo}/${sha}/index.html`;
            const body = `${marker}\n## 👀 Visual preview\n\n[Open the site preview](${previewUrl})\n\nPreview of commit \`${sha.slice(0, 7)}\`. The public GitHub Pages site is unchanged until the pull request is merged.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body
              });
            }
